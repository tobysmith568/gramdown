name: Integration
run-name: Integration for ${{ (inputs.version && format('v{0}', inputs.version)) || (github.event.pull_request.number && format('PR {0}', github.event.pull_request.number)) || github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: Version to stamp onto the build artifacts (SemVer). Omit for a dev build.
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp onto the build artifacts (SemVer). Omit for a dev build.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium firefox
        working-directory: packages/website

      - name: Run Playwright tests
        run: bunx turbo run e2e --filter=@gramdown/website

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/website/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  binaries:
    name: Compile binaries
    needs:
      - typecheck
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set version
        if: inputs.version != ''
        run: bun run set-version
        env:
          VERSION: ${{ inputs.version }}

      - name: Compile binaries
        run: bun run compile:binaries

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist-bin/*
          if-no-files-found: error
          retention-days: 1

  pack:
    name: Pack npm tarballs
    needs:
      - typecheck
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set version
        run: bun run set-version
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}

      - name: Pack
        run: bun run pack

      - name: Upload tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: packages/*/*.tgz
          if-no-files-found: error
          retention-days: 1

  install-test:
    name: Install test
    needs:
      - pack
      - binaries
    uses: ./.github/workflows/install-test.yml
    with:
      version: ${{ inputs.version || '0.0.0' }}

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write
