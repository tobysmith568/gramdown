name: Install test

on:
  workflow_call:
    inputs:
      version:
        description: The SemVer the tarballs/binaries were stamped with at build time.
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm-install:
    name: npm install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node:
          - "20"
          - "24"
          - "26"
        include:
          - os: macos-latest
            node: "20"
          - os: windows-latest
            node: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/test-cli
            packages/fixtures

      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: dist-tarballs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the CLI from the tarball
        run: |
          $tgz  = Get-ChildItem dist-tarballs -Recurse -Filter *.tgz
          $core = ($tgz | Where-Object Name -like    'gramdown-core-*').FullName
          $cli  = ($tgz | Where-Object Name -notlike 'gramdown-core-*').FullName
          "core: $core"
          "cli:  $cli"
          npm install --global $core $cli
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }

      - name: Test CLI
        uses: ./.github/actions/test-cli
        with:
          version: ${{ inputs.version }}

  test-binaries:
    name: Test binaries
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs-on: ubuntu-latest
          - label: linux-arm64
            runs-on: ubuntu-24.04-arm
          - label: darwin-arm64
            runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/test-cli
            packages/fixtures

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist-bin

      - name: Put gramdown on PATH
        shell: bash
        run: |
          chmod +x dist-bin/gramdown-${{ matrix.label }}
          mv dist-bin/gramdown-${{ matrix.label }} dist-bin/gramdown
          echo "${{ github.workspace }}/dist-bin" >> "$GITHUB_PATH"

      - name: Test CLI
        uses: ./.github/actions/test-cli
        with:
          version: ${{ inputs.version }}

  test-binaries-windows-x64:
    name: Test binaries (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/test-cli
            packages/fixtures

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist-bin

      - name: Put gramdown on PATH
        shell: pwsh
        run: |
          Rename-Item dist-bin/gramdown-windows-x64.exe gramdown.exe
          Add-Content $env:GITHUB_PATH '${{ github.workspace }}\dist-bin'

      - name: Test CLI
        uses: ./.github/actions/test-cli
        with:
          version: ${{ inputs.version }}

  test-binaries-darwin-x64:
    name: Test binaries (darwin-x64, via Rosetta)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/test-cli
            packages/fixtures

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist-bin

      - name: Put gramdown on PATH
        shell: bash
        run: |
          chmod +x dist-bin/gramdown-darwin-x64
          cat <<'EOF' > dist-bin/gramdown
          #!/bin/bash
          exec arch -x86_64 "$(dirname "$0")/gramdown-darwin-x64" "$@"
          EOF
          chmod +x dist-bin/gramdown
          echo "${{ github.workspace }}/dist-bin" >> "$GITHUB_PATH"

      - name: Test CLI
        uses: ./.github/actions/test-cli
        with:
          version: ${{ inputs.version }}
