name: Deployment
run-name: Deployment for v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (SemVer, e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  calculate:
    name: Calculate npm dist-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      npm_tag: ${{ steps.npm_tag.outputs.latest-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Set version
        run: bun run set-version
        env:
          VERSION: ${{ inputs.version }}

      - name: Calculate npm tag
        uses: tobysmith568/npm-publish-latest-tag@v1
        id: npm_tag
        with:
          package-json: ./packages/core/package.json

  integration:
    name: Run Integration
    needs:
      - calculate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}

  publish-npm:
    name: Publish to npm
    needs:
      - calculate
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: packages

      - name: Setup Node.js for npm auth
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest

      - name: Publish
        run: NPM_TAG=${{ needs.calculate.outputs.npm_tag }} bun run publish

  release:
    name: Create GitHub Release
    needs:
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist-bin

      - name: Checksum the binaries
        run: |
          cd dist-bin
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
          files: dist-bin/*
          body: |
            Clean Markdown from your Grammarly `.docx` exports.
            [Documentation](https://gramdown.tobythe.dev/docs) ·
            [gramdown.tobythe.dev](https://gramdown.tobythe.dev)

            ## Install or upgrade

            ```sh
            npm install -g gramdown@${{ inputs.version }}
            ```

            Or run it without installing anything:

            ```sh
            npx gramdown@${{ inputs.version }} draft.docx -o draft.md
            ```

            The conversion engine is published alongside it as
            [`@gramdown/core@${{ inputs.version }}`](https://www.npmjs.com/package/@gramdown/core/v/${{ inputs.version }}),
            for calling from your own code. Both are published with npm provenance.

            ## Standalone binaries

            The assets below are single files that run on their own: no Node.js, Bun
            or npm needed. There is one for Linux (x64 and arm64), macOS (Intel and
            Apple silicon) and Windows (x64); see
            [Downloads](https://gramdown.tobythe.dev/docs/downloads) if you are not
            sure which you want.

            ```sh
            chmod +x gramdown-*
            ./gramdown-* draft.docx -o draft.md
            ```

            `SHA256SUMS.txt` carries a checksum for every binary in this release.
            Check the one you downloaded with
            `sha256sum --check --ignore-missing SHA256SUMS.txt`.

  deploy-website:
    name: Redeploy the website
    needs:
      - release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  install-script-test:
    name: Install script (${{ matrix.os }})
    needs:
      - deploy-website
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/test-cli
            packages/fixtures

      - name: Run the live install.sh
        run: curl -fsSL https://gramdown.tobythe.dev/install.sh | sh

      - name: Put gramdown on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test CLI
        uses: ./.github/actions/test-cli
        with:
          version: ${{ inputs.version }}
