<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <!--
    OG / social lockup master (1200x630). public/og.png is rendered from this against the
    self-hosted IBM Plex faces; milestone 8.10.8 wires it into a consolidated Seo partial
    with per-page <meta>. Light palette only - social cards don't switch on scheme. The
    clear-space around the lockup is one cap-height of the wordmark on every side.
  -->
  <rect width="1200" height="630" fill="#f5efe3" />

  <!-- mark: green "g" (the Grammarly source) resolving onto a plain ink rule (the Markdown output) -->
  <g transform="translate(120 116) scale(5.15)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="13" cy="13.2" r="6" stroke="#06603f" stroke-width="3" />
    <path d="M19 13.2 V23.4 q0 4.6 -6.6 4.9" stroke="#06603f" stroke-width="3" />
    <line x1="12" y1="28.1" x2="26.4" y2="28.1" stroke="#211d15" stroke-width="3" />
  </g>

  <text x="286" y="214" font-size="96" font-weight="600" letter-spacing="-2" fill="#211d15">gramdown</text>

  <text font-size="52" font-weight="600" letter-spacing="-1" fill="#211d15">
    <tspan x="122" y="410">Clean Markdown from your</tspan>
    <tspan x="122" y="478">Grammarly .docx exports.</tspan>
  </text>

  <text x="122" y="566" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="30" fill="#78715e">Runs in your browser, or as a CLI. No pandoc.</text>
</svg>
