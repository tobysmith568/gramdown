<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    gramdown mark: a green lowercase "g" (the Grammarly source) resolving onto a plain
    ink rule (the Markdown output) - colour drains out as formatting is stripped.
    Light/dark follow the site palette via prefers-color-scheme.
  -->
  <style>
    .ground { fill: #f5efe3; }
    .g { fill: none; stroke: #06603f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .rule { stroke: #211d15; stroke-width: 3; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #1a160f; }
      .g { stroke: #2fbe91; }
      .rule { stroke: #ece6d8; }
    }
  </style>

  <rect class="ground" width="32" height="32" rx="3" />

  <circle class="g" cx="13" cy="13.2" r="6" />
  <path class="g" d="M19 13.2 V23.4 q0 4.6 -6.6 4.9" />

  <line class="rule" x1="12" y1="28.1" x2="26.4" y2="28.1" />
</svg>
